name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
          version: v2.14.0

      # promtool from the image the compose stack runs (make obs-check); the
      # integration tests pull the same image anyway.
      - name: Check Prometheus config and alert rules
        run: make obs-check

      # kubectl kustomize only (no cluster): catches manifest/patch errors
      # like the ones this offline render already found. kubectl ships on
      # GitHub-hosted ubuntu runners.
      - name: Check Kubernetes manifests render
        run: make k8s-check

      - name: Integration tests
        run: go test -v -race -count=1 ./...

      # Unit-test coverage for internal/domain + internal/app (Phase 5.1);
      # standalone from the compose stack above, so it runs fast even if the
      # integration step is skipped/fails first.
      - name: Coverage (internal/domain + internal/app)
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./internal/domain/... ./internal/app/...
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Coverage (internal/domain + internal/app)";
            echo;
            echo '```';
            cat coverage.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          pct=$(awk '/^total:/ { gsub("%","",$3); print $3 }' coverage.txt)
          echo "combined coverage: $pct%"
          awk -v p="$pct" 'BEGIN { exit (p + 0 >= 80) ? 0 : 1 }' || {
            echo "coverage $pct% is below the 80% target for internal/domain + internal/app" >&2;
            exit 1;
          }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      # Keep GOVULNCHECK_VERSION in sync with the Makefile.
      - name: Install govulncheck
        run: GOTOOLCHAIN=$(go env GOVERSION) go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: govulncheck
        run: govulncheck ./...
