# golangci-lint v2 configuration.
# Version is pinned in the Makefile (GOLANGCI_LINT_VERSION) and in
# .github/workflows/ci.yml; keep both in sync.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    gosec:
      excludes:
        # G104 (unhandled errors) duplicates errcheck, which already honors
        # the std-error-handling exclusions (e.g. deferred Close).
        - G104
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # Test harness patterns: tests run ffmpeg, docker compose and `go env`
      # with computed arguments (G204) and read the files ffmpeg just
      # generated in a temp dir (G304).
      - path: _test\.go
        linters: [gosec]
        text: "G(204|304):"
      # Tests talk to a local server and run short local commands; a context
      # per request or command adds nothing.
      - path: _test\.go
        linters: [noctx]
      # False positive: the request helpers (doRequest, register, login, ...)
      # read and close the body before returning the *http.Response with the
      # body bytes; callers only use the response for its status and headers.
      - path: _test\.go
        linters: [bodyclose]
      # notImplemented (tests/integration/helpers_test.go) is kept for
      # tests added later, even when every current test is enabled (Phase
      # 2.5 onward); see tests/integration/README.md.
      - path: tests/integration/helpers_test\.go
        linters: [unused]
        text: "func notImplemented is unused"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - video-processor
