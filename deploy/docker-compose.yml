# Local stack of the video processor (PLAN.md Phase 2.1).
#
#   make up      # docker compose -f deploy/docker-compose.yml up -d --wait
#   make down    # ... down -v
#
# The integration suite (tests/integration) starts this file with
# `up -d --build --wait` and expects the API on localhost:8080 and the
# MailHog HTTP API on localhost:8025.
#
# Observability (docs/observability.md): Prometheus on localhost:9091 and
# Grafana on localhost:3000 start with everything else (they add no time to
# `up --wait`: they are healthy in a few seconds, in parallel).
#
# Every setting has a development default (${VAR:-default}), so no .env
# file is needed; .env.example documents the variables. Infrastructure ports
# are published on 127.0.0.1 only, for running a service or a test from the
# host.
#
# Metrics (docs/observability.md, "Metrics"): GET /metrics is served on
# api:9090 (METRICS_ADDR), worker:8081 and notifier:8081 (HEALTH_ADDR), and
# RabbitMQ's on rabbitmq:15692. The services' metrics ports are not
# published: the prometheus service scrapes them over the compose network
# (and worker replicas have no fixed host port). Prometheus is on
# http://localhost:9091 and Grafana on http://localhost:3000 (both
# 127.0.0.1 only). Read one by hand with e.g.
#   docker compose -f deploy/docker-compose.yml exec api wget -qO- http://127.0.0.1:9090/metrics

name: video-processor

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-video}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video}
      POSTGRES_DB: ${POSTGRES_DB:-video_processor}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP: during initialization the image runs a temporary
      # server on the Unix socket only, which a socket check reports as ready.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # The topology (exchanges, queues, retry and dead-letter queues) is
  # declared by the api, the worker and the notifier on connect; the same topology is in
  # deploy/rabbitmq/definitions.json for manual import.
  #
  # Plugins (deploy/rabbitmq/enabled_plugins): the management UI and the
  # built-in Prometheus endpoint on 15692 (/metrics aggregated,
  # /metrics/detailed?family=queue_coarse_metrics per queue: the queue
  # depth of video.process, video.notify and the DLQs).
  rabbitmq:
    image: rabbitmq:4-management-alpine
    # A fixed hostname keeps the node name (rabbit@rabbitmq), so durable
    # queues and persistent messages in the volume survive a re-create.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-video}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-video}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # management UI
      - "127.0.0.1:${RABBITMQ_METRICS_PORT:-15692}:15692" # Prometheus metrics
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # S3-compatible object store: SeaweedFS in all-in-one ("mini") mode with
  # the S3 gateway on 8333. Services only speak plain S3 (S3_* variables),
  # so MinIO or AWS S3 can replace it. The bucket is created at startup by
  # -bucket, and again (idempotently) by the api.
  storage:
    image: chrislusf/seaweedfs:4.47
    command:
      - mini
      - -dir=/data
      - -ip=storage
      - -ip.bind=0.0.0.0
      - -bucket=${S3_BUCKET:-videos}
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # Credentials of the S3 admin identity; requests must be signed with
      # them.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-dev-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-dev-secret-key}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025" # web UI and HTTP API (read by the integration tests)
      - "127.0.0.1:${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8025/api/v2/messages?limit=1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # One-shot job: applies the database migrations (db/migrations, embedded
  # in the api binary) and exits. The api starts only after it succeeds.
  # Re-run it with `make migrate`.
  migrate:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-}
        VERSION: ${VERSION:-dev}
    image: video-processor/api:dev
    command: ["migrate"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video_processor}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-}
        VERSION: ${VERSION:-dev}
    image: video-processor/api:dev
    environment:
      HTTP_ADDR: ":8080"
      # GET /metrics, internal only: not published (see the top of the file).
      METRICS_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2s}
      DATABASE_URL: postgres://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video_processor}?sslmode=disable
      AMQP_URL: amqp://${RABBITMQ_USER:-video}:${RABBITMQ_PASSWORD:-video}@rabbitmq:5672/
      S3_ENDPOINT: storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-secret-key}
      S3_BUCKET: ${S3_BUCKET:-videos}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: "false"
      # Development-only signing key; set a real random JWT_SECRET (>= 32
      # bytes) anywhere else. Every api replica must share it.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      JWT_TTL: ${JWT_TTL:-1h}
      # Upload limit (default 1 GiB) and the outbox relay (ADR 0004).
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
      # Cache of GET /api/v1/videos (docs/cache.md); empty REDIS_URL disables it.
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
      CACHE_TTL: ${CACHE_TTL:-30s}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      # Liveness only: /readyz would make the api unhealthy whenever a
      # dependency blips.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    # Longer than SHUTDOWN_TIMEOUT, so in-flight requests can finish.
    stop_grace_period: 20s

  # Processing workers (RF1): WORKER_REPLICAS containers x WORKER_CONCURRENCY
  # jobs each = 2 x 2 = 4 processing slots by default (the integration
  # suite needs at least 2). Scale with `docker compose up --scale worker=N`.
  # The integration suite restarts this service by the name "worker".
  worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-}
        VERSION: ${VERSION:-dev}
    image: video-processor/worker:dev
    environment:
      HEALTH_ADDR: ":8081"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${WORKER_SHUTDOWN_TIMEOUT:-15s}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2s}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-0}
      FFMPEG_TIMEOUT: ${FFMPEG_TIMEOUT:-10m}
      DATABASE_URL: postgres://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video_processor}?sslmode=disable
      AMQP_URL: amqp://${RABBITMQ_USER:-video}:${RABBITMQ_PASSWORD:-video}@rabbitmq:5672/
      S3_ENDPOINT: storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-secret-key}
      S3_BUCKET: ${S3_BUCKET:-videos}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: "false"
      # The worker invalidates the api's list cache on every status change.
      REDIS_URL: ${REDIS_URL-redis://redis:6379/0}
      # Relay of the video.failed / video.processed events (ADR 0004).
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    # Longer than SHUTDOWN_TIMEOUT, so in-flight jobs can finish.
    stop_grace_period: 20s

  # Failure e-mails (RF5): consumes video.notify (video.failed events) and
  # sends through MailHog. Production SMTP: set SMTP_HOST, SMTP_PORT,
  # SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM and SMTP_TLS (starttls or tls).
  notifier:
    build:
      context: ..
      dockerfile: deploy/docker/notifier.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-}
        VERSION: ${VERSION:-dev}
    image: video-processor/notifier:dev
    environment:
      HEALTH_ADDR: ":8081"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${NOTIFIER_SHUTDOWN_TIMEOUT:-15s}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2s}
      NOTIFIER_CONCURRENCY: ${NOTIFIER_CONCURRENCY:-4}
      NOTIFIER_MAX_ATTEMPTS: ${NOTIFIER_MAX_ATTEMPTS:-0}
      DATABASE_URL: postgres://${POSTGRES_USER:-video}:${POSTGRES_PASSWORD:-video}@postgres:5432/${POSTGRES_DB:-video_processor}?sslmode=disable
      AMQP_URL: amqp://${RABBITMQ_USER:-video}:${RABBITMQ_PASSWORD:-video}@rabbitmq:5672/
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-FIAP X Video Processor <no-reply@fiapx.local>}"
      SMTP_TLS: ${SMTP_TLS:-none}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-30s}
      # Link to the web UI written in the e-mails.
      APP_URL: ${APP_URL:-http://localhost:8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    # Longer than SHUTDOWN_TIMEOUT, so in-flight e-mails can finish.
    stop_grace_period: 20s

  # Metrics and alerts (docs/observability.md, "Prometheus", "Alerts"):
  # scrapes every service over the compose network (worker replicas through
  # Docker's DNS, so --scale worker=N just works) and evaluates the rules in
  # deploy/prometheus/rules. UI on http://localhost:9091 (host port 9091,
  # not 9090, which is the api's internal metrics port). Started by default
  # with the rest of the stack: it adds a few seconds to `up --wait`.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A local demo: keep little history.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-2d}
      - --storage.tsdb.retention.size=512MB
      # POST /-/reload re-reads the config and rules after an edit.
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # Dashboards (docs/observability.md, "Grafana"): the Prometheus datasource
  # and the "FIAP X Video Processor" dashboard (deploy/grafana/dashboards)
  # are provisioned, nothing to click. http://localhost:3000 opens the
  # dashboard read-only for anonymous visitors (local demo only); sign in
  # with GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD (dev defaults
  # admin/admin) to edit. Provisioned dashboards are reloaded from disk
  # every 10 s.
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/video-processor.json
      # No outbound calls: no plugin preinstall, update checks, news or
      # usage reporting (the stack also runs offline).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-warn}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

volumes:
  postgres-data:
  rabbitmq-data:
  storage-data:
  prometheus-data:
