apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifier
        app.kubernetes.io/component: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notifier
          image: video-processor/notifier:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: HEALTH_ADDR
              value: ":8081"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: DATABASE_URL } }
            - name: AMQP_URL
              valueFrom: { secretKeyRef: { name: app-secrets, key: AMQP_URL } }
            - name: SMTP_USERNAME
              valueFrom: { secretKeyRef: { name: app-secrets, key: SMTP_USERNAME } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: SMTP_PASSWORD } }
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notifier
  labels:
    app.kubernetes.io/name: notifier
    app.kubernetes.io/component: app
spec:
  selector:
    app.kubernetes.io/name: notifier
  ports:
    - name: health
      port: 8081
      targetPort: 8081
