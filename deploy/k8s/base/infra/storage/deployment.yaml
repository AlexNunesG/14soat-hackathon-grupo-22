# S3-compatible object storage: SeaweedFS in all-in-one ("mini") mode, same
# image/flags as deploy/docker-compose.yml. Services only speak plain S3
# (S3_* variables), so a managed deployment swaps this for MinIO or AWS S3
# — a config change (S3_ENDPOINT/credentials), not a code change; that is
# what the ports/adapters architecture (internal/adapters/storage) buys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/component: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage
        app.kubernetes.io/component: infra
    spec:
      containers:
        - name: storage
          image: chrislusf/seaweedfs:4.47
          args:
            - mini
            - -dir=/data
            - -ip=storage
            - -ip.bind=0.0.0.0
            - -bucket=videos
            - -webdav=false
            - -admin.ui=false
            - -master.telemetry=false
            - -s3.port.iceberg=0
            - -s3.port.lance=0
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: app-secrets, key: S3_ACCESS_KEY } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: S3_SECRET_KEY } }
          ports:
            - name: s3
              containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: 8333 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /healthz, port: 8333 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: storage-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-data
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/component: infra
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: storage
  labels:
    app.kubernetes.io/name: storage
    app.kubernetes.io/component: infra
spec:
  selector:
    app.kubernetes.io/name: storage
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
