# Prometheus scrape configuration.
#
# Only self-monitoring is wired up for now. Scrape targets for auth-service,
# video-service, worker-service, and notification-service (each exposing
# /metrics) and RabbitMQ's rabbitmq_prometheus plugin are added once those
# services exist. See .ai-agents/PLAN.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

