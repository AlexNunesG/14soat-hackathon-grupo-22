# Alerting rules of the video processor (docs/observability.md, "Alerts").
# There is no Alertmanager in the local stack: firing alerts are shown on
# the Prometheus UI (/alerts) and on the Grafana dashboard. Every alert has
# a severity (critical: users are affected now; warning: needs a look) and
# names the metric to look at. Validate with `make obs-check`.

groups:
  - name: availability
    rules:
      - alert: ScrapeTargetDown
        # One per target: a worker replica, the api, the notifier or
        # RabbitMQ. A restarted worker comes back within seconds, well under
        # the "for".
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus could not scrape {{ $labels.instance }} (job {{ $labels.job }}) for 1 minute: the container is stopped, unhealthy or unreachable."

      - alert: NoWorkerConsumers
        # RF1/RF2: uploads are still accepted and queued, but nothing
        # processes them.
        expr: rabbitmq_detailed_queue_consumers{queue="video.process"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No worker is consuming video.process"
          description: "video.process has had no consumer for 1 minute: uploaded videos stay PENDING. Check the worker containers (docker compose ps worker)."

      - alert: NoNotifierConsumers
        # RF5: failure e-mails are queued but not sent.
        expr: rabbitmq_detailed_queue_consumers{queue="video.notify"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "No notifier is consuming video.notify"
          description: "video.notify has had no consumer for 2 minutes: failure e-mails are delayed (not lost). Check the notifier container."

  - name: processing
    rules:
      - alert: VideoProcessDLQNotEmpty
        expr: rabbitmq_detailed_queue_messages{queue="video.process.dlq"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} job(s) in video.process.dlq"
          description: "Jobs were given up on after every retry, or were malformed; their videos ended FAILED. Inspect them in the RabbitMQ management UI (docs/messaging.md) and replay or purge them."

      - alert: JobFailureRatioHigh
        # Videos that ended FAILED (failed + dead_lettered) over every
        # finished job, over 10 minutes, once at least 5 jobs finished.
        # Corrupt uploads are user errors and fail too, so the threshold is
        # high: it catches a worker that fails everything (e.g. a broken
        # ffmpeg or storage).
        expr: |
          (
            sum(increase(videoproc_jobs_total{outcome=~"failed|dead_lettered"}[10m]))
            /
            sum(increase(videoproc_jobs_total{outcome=~"done|failed|dead_lettered"}[10m]))
          ) > 0.5
          and
          sum(increase(videoproc_jobs_total{outcome=~"done|failed|dead_lettered"}[10m])) >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of the videos processed in the last 10 minutes FAILED"
          description: "More than half of the finished jobs ended FAILED. Check the worker logs (msg \"video cannot be processed\") for a common reason."

      - alert: JobRetriesHigh
        # Transient failures (storage, database, broker) make jobs go
        # through the retry queues.
        expr: sum(rate(videoproc_jobs_total{outcome="retried"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Jobs are being retried ({{ $value | humanize }}/s)"
          description: "Workers keep hitting transient errors. Check /readyz of the workers and the storage, Postgres and RabbitMQ containers."

      - alert: VideoProcessBacklog
        # RF2: nothing is lost, but videos wait. Scale the workers
        # (docker compose up -d --scale worker=N).
        expr: rabbitmq_detailed_queue_messages_ready{queue="video.process"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} jobs waiting in video.process"
          description: "The backlog has stayed above 50 jobs for 10 minutes: add worker replicas or raise WORKER_CONCURRENCY."

  - name: outbox
    rules:
      - alert: OutboxStuck
        # Rows are waiting but no relay has published anything: the relays
        # are down or every publish fails (ADR 0004).
        expr: |
          max(videoproc_outbox_pending) > 0
          and
          sum(rate(videoproc_outbox_published_total{result="ok"}[2m])) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} outbox row(s) pending and nothing published for 2 minutes"
          description: "Uploads are recorded but not queued. Check RabbitMQ and the relays' logs (msg \"outbox\") in the api and the workers."

      - alert: OutboxBacklogGrowing
        expr: |
          max(videoproc_outbox_pending) > 100
          and
          delta(max(videoproc_outbox_pending)[5m:15s]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The outbox backlog is growing ({{ $value }} rows)"
          description: "More than 100 rows are waiting and the number keeps growing: the relays publish slower than rows are written, or publishes fail (videoproc_outbox_published_total{result=\"error\"})."

  - name: api
    rules:
      - alert: APIHighErrorRatio
        # 5xx over every request but the probes (the healthchecks would
        # dilute it), once there is some traffic (0.1 req/s). Same ratio as
        # the dashboard's "5xx ratio" panel.
        expr: |
          (
            sum(rate(videoproc_http_requests_total{status=~"5..",route!~"/healthz|/readyz"}[5m]))
            /
            sum(rate(videoproc_http_requests_total{route!~"/healthz|/readyz"}[5m]))
          ) > 0.05
          and
          sum(rate(videoproc_http_requests_total{route!~"/healthz|/readyz"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value | humanizePercentage }} of the API requests fail with 5xx"
          description: "Check the api logs (level ERROR, msg \"http request\") and GET /readyz."

  - name: notifications
    rules:
      - alert: VideoNotifyDLQNotEmpty
        # RF5: a failure e-mail could not be sent after every retry.
        expr: rabbitmq_detailed_queue_messages{queue="video.notify.dlq"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} failure e-mail(s) in video.notify.dlq"
          description: "The notifier gave up sending these e-mails (about 21 minutes of retries). Check the SMTP server and replay them (docs/notifications.md)."

      - alert: SMTPErrors
        expr: sum(rate(videoproc_smtp_send_duration_seconds_count{result="error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SMTP sends are failing"
          description: "The notifier cannot send some e-mails; they are retried (video.notify.retry.N). Check SMTP_* and the mail server."
